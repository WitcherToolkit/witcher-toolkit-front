<div class="height-page">
<h1 class="center-align">Les caractéristiques</h1>

<div class="container mb-5">
  <div class="row">
    <div class="col-4 offset-4">
      <div class="card">
        <form class="card-body">
          <div class="form-group">
            
            <div class="row">
              <div class="col s10">
                <div class="row">
                  <div class="col s3"></div>
                  <div class="input-field col s6">
                    <i class="material-icons prefix">search</i>
                    <input id="icon_prefix" type="text" name="searchTerm" class="validate"  #searchField [value]="searchTerm()" (input)="searchTerm.set(searchField.value)">
                    <label for="icon_prefix">Rechercher une caracteristique</label>
                  </div>
                </div>
                
              </div>
              <div class="col s2 add-btn-col">
                <a class="btn-floating btn-large waves-light teal lighten-2" *ngIf="auth.hasRole('ROLE_ADMIN')" (click)="openCreateModal()"><i class="material-icons">add</i></a>
              </div>
            </div>
            
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="cards-grid">
    
    <!-- Afficher le message "Aucun résultat" si la liste est vide -->
    <div *ngIf="caracteristiquesListFiltered().length === 0" class="col-12 text-center">
      <p>Aucun résultat</p>
    </div>

    <!-- Afficher les cartes des caracteristique filtrées -->
    
    <div *ngFor="let caracteristique of caracteristiquesListFiltered(); trackBy: trackById">

      <div class="col s12 m4">
        <div class="card horizontal" appSelectionBorder>
          <div class="card-stacked">
            <span class="card-title center-align">{{ caracteristique.nom }} ({{ caracteristique.code }})</span>
            <div class="card-content">
              <div class="card-text">
                <p>{{ truncateText(caracteristique.description) }}</p>
              </div>
            </div>
            
            <div class="card-action">
              <a *ngIf="auth.isLoggedIn()" (click)="openModal(caracteristique)" href="javascript:void(0)">Voir</a>
              <a *ngIf="auth.hasRole('ROLE_ADMIN')" (click)="openUpdateModal(caracteristique)" href="javascript:void(0)">Modifier</a>
              <a *ngIf="auth.hasRole('ROLE_ADMIN')" (click)="openDeleteModal(caracteristique)" href="javascript:void(0)">Supprimer</a>
            </div>

          </div>
        </div>
      </div>
    </div>    
  </div>
</div>
</div>
<app-caracteristiques-detail-modal [caracteristique]="selectedCaracteristique"></app-caracteristiques-detail-modal>
<app-caracteristiques-update-modal [caracteristique]="selectedCaracteristique" (caracteristiqueUpdated)="onCaracteristiqueUpdated($event)"></app-caracteristiques-update-modal>
<app-confirm-delete-modal-component #deleteModal *ngIf="caracteristiqueToDelete" [itemName]="caracteristiqueToDelete.nom" (confirm)="deleteCaracteristique()" (cancel)="caracteristiqueToDelete = null"></app-confirm-delete-modal-component>
