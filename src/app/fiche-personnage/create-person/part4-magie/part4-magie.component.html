<div [formGroup]="form">
  <!-- Magies sélectionnées -->
  <div class="row" *ngIf="selectedProfession?.maxSort">
    <div class="col s12">
      <label>{{ magieNom }} sélectionnés :</label>
      <div class="row">
        <div *ngFor="let item of selectedMagies.controls" class="chip special-chip">
          {{ item.value }}
          <i class="close material-icons" (click)="removeChipMagie(item.value)">close</i>
        </div>
      </div>
    </div>
  </div>

  <!-- Magies disponibles -->
  <div class="row" *ngIf="selectedProfession?.maxSort">
    <div class="col s12">
      <label>Choisir {{ selectedProfession?.maxSort }} sorts</label>
      <div class="row">
        <div *ngFor="let magie of magieDisponible; let i = index" class="col s4">
          <p>
            <label>
              <input
                type="checkbox"
                [value]="magie.nom"
                (change)="onCheckboxChangeMagie($event)"
                [checked]="selectedMagies.value.includes(magie.nom)"
                [disabled]="isMagieDisabled(magie.nom)"
              />
              <span>{{ magie.nom }}</span>
              <i
                class="material-icons tooltipped"
                materializeTooltip
                data-position="right"
                [attr.data-tooltip]="magie.effet"
                style="cursor:pointer; margin-left:4px;"
              >info_outline</i>
            </label>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Rituels sélectionnés -->
  <div class="row" *ngIf="selectedProfession?.maxRituel">
    <div class="col s12">
      <label>{{ rituelNom }} sélectionnés :</label>
      <div class="row">
        <div *ngFor="let item of selectedRituels.controls" class="chip special-chip">
          {{ item.value }}
          <i class="close material-icons" (click)="removeChipRituel(item.value)">close</i>
        </div>
      </div>
    </div>
  </div>

  <!-- Rituels disponibles -->
  <div class="row" *ngIf="selectedProfession?.maxRituel">
    <div class="col s12">
      <label>Choisir {{ selectedProfession?.maxRituel }} rituels</label>
      <div class="row">
        <div *ngFor="let rituel of rituelDisponible; let i = index" class="col s4">
          <p>
            <label>
              <input
                type="checkbox"
                [value]="rituel.nom"
                (change)="onCheckboxChangeRituel($event)"
                [checked]="selectedRituels.value.includes(rituel.nom)"
                [disabled]="isRituelDisabled(rituel.nom)"
              />
              <span>{{ rituel.nom }}</span>
              <i
                class="material-icons tooltipped"
                materializeTooltip
                data-position="right"
                [attr.data-tooltip]="rituel.effet"
                style="cursor:pointer; margin-left:4px;"
              >info_outline</i>
            </label>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Envoutements sélectionnés -->
  <div class="row" *ngIf="selectedProfession?.maxEnvoutement">
    <div class="col s12">
      <label>{{ envoutementNom }} sélectionnés :</label>
      <div class="row">
        <div *ngFor="let item of selectedEnvoutement.controls" class="chip special-chip">
          {{ item.value }}
          <i class="close material-icons" (click)="removeChipEnvoutement(item.value)">close</i>
        </div>
      </div>
    </div>
  </div>

  <!-- Envoutements disponibles -->
  <div class="row" *ngIf="selectedProfession?.maxEnvoutement">
    <div class="col s12">
      <label>Choisir {{ selectedProfession?.maxEnvoutement }} envoûtements</label>
      <div class="row">
        <div *ngFor="let envoutement of envoutementDisponible; let i = index" class="col s4">
          <p>
            <label>
              <input
                type="checkbox"
                [value]="envoutement.nom"
                (change)="onCheckboxChangeEnvoutement($event)"
                [checked]="selectedEnvoutement.value.includes(envoutement.nom)"

              <span>{{ envoutement.nom }}</span>
              <i
                class="material-icons tooltipped"

                data-position="right"
                [attr.data-tooltip]="envoutement.effet"
                style="cursor:pointer; margin-left:4px;"
              >info_outline</i>
            </label>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
