<div #modal id="modal1" class="modal">
  <div class="modal-content">
    <h4 class="center-align">{{ envoutement?.nom }}</h4>
    
    <div class="row">
      <div class="col s1"></div>
      <div class="col s5"><b>Coût :</b> {{ envoutement?.cout }} END</div>
      <div class="col s5"><b>Danger :</b> {{ envoutement?.danger }}</div>
      <div class="col s1"></div>
    </div>

    <div class="row">
      <div class="col s1"></div>
      <div class="col s10"><b>Près-requis pour lever la malédiction :</b></div>
      <div class="col s1"></div>
    </div>

    <div class="row">
      <div class="col s1"></div>
      <div class="col s10">{{ envoutement?.prerequis }}</div>
      <div class="col s1"></div>
    </div>

    <div class="row">
      <div class="col s1"></div>
      <div class="col s10"><b>Effet :</b></div>
      <div class="col s1"></div>
    </div>

    <div class="row">
      <div class="col s1"></div>
      <div class="col s10">{{ envoutement?.effet }}</div>
      <div class="col s1"></div>
    </div>

  </div>

  <div class="modal-footer">
    <button type="button" class="modal-close btn-flat">Fermer</button>
  </div>
</div>
