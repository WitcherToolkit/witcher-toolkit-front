<div class="height-page">
<h1 class="center-align">Les professions</h1>

<div class="container mb-5">
  <div class="row">
    <div class="col-4 offset-4">
      <div class="card">

        <form class="card-body">
          <div class="form-group">
            
            <div class="row">
              <div class="col s10">
                <div class="row">
                  <div class="col s3"></div>
                  <div class="input-field col s6">
                    <i class="material-icons prefix">search</i>
                    <input id="icon_prefix" type="text" name="searchTerm" class="validate"  #searchField [value]="searchTerm()" (input)="searchTerm.set(searchField.value)">
                    <label for="icon_prefix">Rechercher une profession</label>
                  </div>
                </div>
                
              </div>
              <div class="col s2 add-btn-col">
                <a class="btn-floating btn-large waves-light teal lighten-2" *ngIf="auth.hasRole('ADMIN')" (click)="openCreatePage()"><i class="material-icons">add</i></a>
              </div>
            </div>
            
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="cards-grid">
    <div *ngIf="professionsListFiltered().length === 0" class="col-12 text-center">
        <p>Aucun résultat</p>
    </div>

    <div *ngFor="let profession of professionsListFiltered(); trackBy: trackById">
        <div class="col s12 m4">
            <div class="card horizontal" appSelectionBorder>
                <div class="card-stacked">
                  <span class="card-title center-align">{{ profession.nom }}</span>
                  <div class="card-content">
                    <div class="card-text">
                      <p> {{ truncateText(profession.description) }}</p>
                    </div>
                  </div>

                  <div class="card-action">
                    <a *ngIf="auth.isLoggedIn()" (click)="openModal(profession)" href="javascript:void(0)">Voir</a>
                    <a *ngIf="auth.hasRole('ADMIN')" (click)="openUpdatePage(profession)">Modifier</a>
                    <a *ngIf="auth.hasRole('ADMIN')" (click)="openDeleteModal(profession)" href="javascript:void(0)">Supprimer</a>
                  </div>
                </div>
            </div>
        </div>
      </div>

  </div>
</div>
</div>
<app-professions-detail-modal [profession]="selectedProfession"></app-professions-detail-modal>
<app-confirm-delete-modal-component #deleteModal *ngIf="professionToDelete" [itemName]="professionToDelete.nom" (confirm)="deleteProfession()" (cancel)="professionToDelete = null"></app-confirm-delete-modal-component>
