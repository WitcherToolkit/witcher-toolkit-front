<div #modal id="modal1" class="modal">
  <div class="modal-content">
    <h4 class="center-align">Suppresion de {{ itemName }}</h4>
    
    <div class="row"><div class="col s12"></div></div>
    
    <div class="row">
      <div class="col s1"></div>
      <div class="col s10 center-align">Vous êtes sur le point de supprimer <b>{{ itemName }}</b>.<br>Êtes-vous sûr de votre choix ? Cette action est irréversible.</div>
      <div class="col s1"></div>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn red lighten-2" (click)="onConfirm()">Confirmer</button>
    <button class="btn teal lighten-2" (click)="onCancel()">Annuler</button>
  </div>
</div>
